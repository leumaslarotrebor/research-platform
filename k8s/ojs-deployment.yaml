apiVersion: apps/v1
kind: Deployment
metadata:
  name: ojs
  namespace: research-platform
  labels:
    app.kubernetes.io/name: ojs
    app.kubernetes.io/part-of: research-platform
spec:
  # Single replica: OJS's default session/file handling assumes local
  # disk (see ojs/php.ini-production-overrides.ini comment on
  # session.save_path). Running >1 replica would need a shared session
  # store and a ReadWriteMany volume for /var/www/files — real, called
  # out as a production consideration in docs/deployment.md, not
  # implemented here since it isn't needed to demonstrate the skill.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ojs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ojs
        app.kubernetes.io/part-of: research-platform
    spec:
      containers:
        - name: ojs
          image: ghcr.io/YOUR_GITHUB_USERNAME/research-platform-ojs:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: ojs-config
          env:
            - name: OJS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: db-name
            - name: OJS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: db-user
            - name: OJS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: db-password
            - name: OJS_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: ojs-app-secret
                  key: app-key
          volumeMounts:
            - name: ojs-files
              mountPath: /var/www/files
            - name: ojs-public
              mountPath: /var/www/html/public
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /index.php/index/login
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /index.php/index/login
              port: 80
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: ojs-files
          persistentVolumeClaim:
            claimName: ojs-files
        - name: ojs-public
          persistentVolumeClaim:
            claimName: ojs-public
---
apiVersion: v1
kind: Service
metadata:
  name: ojs
  namespace: research-platform
  labels:
    app.kubernetes.io/name: ojs
    app.kubernetes.io/part-of: research-platform
spec:
  selector:
    app.kubernetes.io/name: ojs
  ports:
    - port: 80
      targetPort: 80
