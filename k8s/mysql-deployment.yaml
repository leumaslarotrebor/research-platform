apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: research-platform
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: research-platform
spec:
  # Deliberately a single-replica Deployment, not a StatefulSet:
  # a portfolio-scale single MySQL instance doesn't need StatefulSet
  # ordering/identity guarantees, and introducing one here would be
  # complexity without a real payoff (see docs/architecture.md).
  replicas: 1
  strategy:
    type: Recreate # avoid two MySQL pods ever writing to the same PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/part-of: research-platform
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: root-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: db-name
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: db-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: db-password
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD}"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD}"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: init-scripts
          configMap:
            name: mysql-init-scripts
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: research-platform
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: research-platform
spec:
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - port: 3306
      targetPort: 3306
  # ClusterIP (default) — MySQL is never exposed outside the cluster.
