apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-api
  namespace: research-platform
  labels:
    app.kubernetes.io/name: laravel-api
    app.kubernetes.io/part-of: research-platform
spec:
  replicas: 2 # stateless — safe to run more than one
  selector:
    matchLabels:
      app.kubernetes.io/name: laravel-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: laravel-api
        app.kubernetes.io/part-of: research-platform
    spec:
      containers:
        - name: laravel-api
          image: ghcr.io/YOUR_GITHUB_USERNAME/research-platform-laravel-api:latest
          ports:
            - containerPort: 80
          env:
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: DB_CONNECTION
              value: mysql
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: research_api
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: db-password
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: laravel-app-secret
                  key: app-key
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-api
  namespace: research-platform
  labels:
    app.kubernetes.io/name: laravel-api
    app.kubernetes.io/part-of: research-platform
spec:
  selector:
    app.kubernetes.io/name: laravel-api
  ports:
    - port: 80
      targetPort: 80
