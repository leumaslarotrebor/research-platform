; ojs/php.ini-production-overrides.ini
; Non-sensitive PHP runtime tuning for OJS. No credentials belong here.

upload_max_filesize = 20M
post_max_size = 22M
memory_limit = 256M
max_execution_time = 120
max_input_vars = 3000

; OJS's editorial workflow does a lot of session-heavy work; keep
; sessions on disk inside the container's writable /tmp for local/dev.
; In a real production deployment this would point at a shared session
; store (e.g. Redis) so multiple OJS replicas share sessions — noted
; as a production consideration in docs/deployment.md rather than
; implemented here, since a single-replica portfolio deployment
; doesn't need it.
session.save_path = "/tmp"

; opcache tuning — real, measurable win for a PHP app, costs nothing
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
