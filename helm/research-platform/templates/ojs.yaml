apiVersion: v1
kind: ConfigMap
metadata:
  name: ojs-config
  namespace: {{ include "research-platform.namespace" . }}
  labels:
    app.kubernetes.io/name: ojs
    {{- include "research-platform.labels" . | nindent 4 }}
data:
  OJS_BASE_URL: {{ .Values.ojs.baseUrl | quote }}
  OJS_DB_HOST: "mysql"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ojs-files
  namespace: {{ include "research-platform.namespace" . }}
  labels:
    app.kubernetes.io/name: ojs
    {{- include "research-platform.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.ojs.storage.storageClassName }}
  storageClassName: {{ .Values.ojs.storage.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ojs.storage.filesSize }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ojs-public
  namespace: {{ include "research-platform.namespace" . }}
  labels:
    app.kubernetes.io/name: ojs
    {{- include "research-platform.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.ojs.storage.storageClassName }}
  storageClassName: {{ .Values.ojs.storage.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ojs.storage.publicSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ojs
  namespace: {{ include "research-platform.namespace" . }}
  labels:
    app.kubernetes.io/name: ojs
    {{- include "research-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ojs.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ojs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ojs
        {{- include "research-platform.labels" . | nindent 8 }}
    spec:
      containers:
        - name: ojs
          image: "{{ .Values.ojs.image.repository }}:{{ .Values.ojs.image.tag }}"
          imagePullPolicy: {{ .Values.ojs.image.pullPolicy }}
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: ojs-config
          env:
            - name: OJS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.existingSecret }}
                  key: db-name
            - name: OJS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.existingSecret }}
                  key: db-user
            - name: OJS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.existingSecret }}
                  key: db-password
            - name: OJS_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: ojs-app-secret
                  key: app-key
          volumeMounts:
            - name: ojs-files
              mountPath: /var/www/files
            - name: ojs-public
              mountPath: /var/www/html/public
          resources:
            {{- toYaml .Values.ojs.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /index.php/index/login
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /index.php/index/login
              port: 80
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: ojs-files
          persistentVolumeClaim:
            claimName: ojs-files
        - name: ojs-public
          persistentVolumeClaim:
            claimName: ojs-public
---
apiVersion: v1
kind: Service
metadata:
  name: ojs
  namespace: {{ include "research-platform.namespace" . }}
  labels:
    app.kubernetes.io/name: ojs
    {{- include "research-platform.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: ojs
  ports:
    - port: 80
      targetPort: 80
