{{- if .Values.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: {{ include "research-platform.namespace" . }}
  labels:
    {{- include "research-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-password: {{ required "secretValues.mysqlRootPassword is required when createSecrets=true" .Values.secretValues.mysqlRootPassword | quote }}
  db-name: {{ .Values.mysql.database | quote }}
  db-user: {{ .Values.mysql.user | quote }}
  db-password: {{ required "secretValues.mysqlAppPassword is required when createSecrets=true" .Values.secretValues.mysqlAppPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ojs-app-secret
  namespace: {{ include "research-platform.namespace" . }}
  labels:
    {{- include "research-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  app-key: {{ required "secretValues.ojsAppKey is required when createSecrets=true" .Values.secretValues.ojsAppKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: laravel-app-secret
  namespace: {{ include "research-platform.namespace" . }}
  labels:
    {{- include "research-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  app-key: {{ required "secretValues.laravelAppKey is required when createSecrets=true" .Values.secretValues.laravelAppKey | quote }}
{{- end }}
